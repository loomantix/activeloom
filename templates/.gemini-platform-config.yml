# Consumer configuration for the gemini-platform sync engine.
#
# See https://github.com/loomantix/gemini-platform for details.

substitutions:
  PROJECT_NAME: MyProject

# Targets to skip in this consumer repository
skip_targets:
  - .github/workflows/dco.yml

# Destinations the upstream sync engine is authorized to manage.
# Matches gitignore-style patterns.
allowed_destinations:
  - .agents/**
  - agent-loop-instructions.md
  - .github/workflows/dco.yml
