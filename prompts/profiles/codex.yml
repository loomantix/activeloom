# Codex harness profile. See `claude.yml` for what each block means and
# `docs/prompt-rendering.md` for the rendering contract.

root: .codex

values:
  SKILLS_ROOT: .codex/skills
  REFS_ROOT: .codex/references
  WORKFLOW_DOC: .codex/REVIEW_WORKFLOW.md

  # Codex names a skill bare, with no slash prefix.
  INVOKE: ''
  ENGINE_ID: codex
  ENGINE_CLI: codex

  TODO_TOOL: update_plan

  # A Codex consumer reads `AGENTS.md`; it has no reason to look in a
  # Claude-specific file.
  AGENT_DOC: AGENTS.md

  # Marked-up form of the same name; see `claude.yml`.
  AGENT_DOC_CODE: '`AGENTS.md`'

  Q_BULLET: ''
  REC_BULLET: 'Recommend: '

  # Inline-first, because this harness does not always have a subagent to
  # delegate to — the capability is stated as conditional rather than assumed.
  SUBAGENT_GUIDANCE: >-
    Most lookups here are two greps and a read, and belong inline. Reach for
    delegation only where this session supports it and the lookup is both
    genuinely independent and too large for a handful of tool calls — a sweep
    across many files or repos. State a word ceiling on what it returns.

  REVIEW_CHAIN_POINTER: >-
    Adversarial code review lives in `critique`, `deepcritique`, and
    `pr-critique`

skills:
  issues:
    FM_EXTRAS: ''

  feature-dev:
    FM_EXTRAS: ''

  diagnosing-bugs:
    FM_EXTRAS: ''

  task-packet:
    FM_EXTRAS: ''

  grill:
    # No `disable-model-invocation` on this harness, so the description has to
    # carry its own trigger prose or the skill never fires. The leading space is
    # load-bearing: the value is appended directly to the sentence before it.
    FM_EXTRAS: ''
    DESC_TRIGGER: ' Use when the user asks to grill an idea, pressure-test a design, or work out what to build before any code exists.'

  onboard:
    # No `disable-model-invocation` on this harness, so the description carries
    # its own trigger prose or the skill never fires. The leading space is
    # load-bearing: the value is appended directly to the sentence before it.
    FM_EXTRAS: ''
    DESC_TRIGGER: ' Use after `npx activeloom init` when .activeloom-config.yml still has TODO(activeloom) markers to fill.'

  phone-install:
    FM_EXTRAS: ''

# --- prompt stack ------------------------------------------------------------
# See `claude.yml` for what this block is and why it lives in the profile.
#
# This engine's finder lenses are role files inside the synced surface, so they
# are covered here. The sibling engine's are plugin agents outside its synced
# surface and are not — a difference in what each engine can read in a consumer
# checkout, not a difference in method. The two digests were never comparable to
# each other in the first place: each names one engine's own prompt generation.
#
# `code-architect.md` and `code-explorer.md` are excluded. They are roles this
# repository ships, but no review pass loads them, so an edit to either would
# report a prompt-generation change that no review actually saw.
prompt_stack:
  - .codex/REVIEW_WORKFLOW.md
  - .codex/references/local-review-ledger.md
  - .codex/references/roles/code-reviewer.md
  - .codex/references/roles/comment-analyzer.md
  - .codex/references/roles/pr-test-analyzer.md
  - .codex/references/roles/security-reviewer.md
  - .codex/references/roles/silent-failure-hunter.md
  - .codex/references/roles/type-design-analyzer.md
  - .codex/skills/critique/SKILL.md
  - .codex/skills/deepcritique/SKILL.md
  - .codex/skills/pr-critique/SKILL.md
  - .codex/skills/refactorpass/SKILL.md
  - .codex/skills/reviewit/SKILL.md
