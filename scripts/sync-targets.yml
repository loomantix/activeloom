# Canonical sync manifest for gemini-platform.
#
# `sync-engine.py` reads this file from the upstream checkout (this repo, or
# a fork of it) to learn which files to copy into a consumer repo, and which
# `<<KEY>>` placeholders to substitute from the consumer's
# `.gemini-platform-config.yml`.
#
# `substitutions: []` means verbatim copy. `delete: true` causes the engine
# to remove the destination from the consumer (and prune empty parent
# directories) — use this to retire a previously-synced file across all
# consumers. `mode` (e.g. `"0755"`) sets the destination permissions.

targets:
  # Antigravity / Gemini skills
  - source: .agents/skills/issues/SKILL.md
    destination: .agents/skills/issues/SKILL.md
    substitutions: []

  - source: .agents/skills/issues/scripts/ready.py
    destination: .agents/skills/issues/scripts/ready.py
    substitutions: []
    mode: '0755'

  - source: .agents/skills/issues/scripts/link.py
    destination: .agents/skills/issues/scripts/link.py
    substitutions: []
    mode: '0755'

  - source: .agents/skills/refactorpass/SKILL.md
    destination: .agents/skills/refactorpass/SKILL.md
    substitutions: []

  - source: .agents/skills/critique/SKILL.md
    destination: .agents/skills/critique/SKILL.md
    substitutions: []

  # The ledger is a build artifact of `@loomantix/review-ledger`, vendored
  # verbatim from the published tarball and run as `node review-ledger.js`.
  # Mode is 0644 deliberately: npm normalises non-`bin` files to 0644 in the
  # tarball, so the committed file is not executable and nothing may invoke it
  # as `./review-ledger.js`. The sibling `package.json` declaring
  # `"type": "module"` must sync with it — the bundle is ESM under a `.js`
  # name, so without it Node resolves the module type from the CONSUMER's root
  # manifest and a `"type": "commonjs"` repository fails with a SyntaxError.
  # `review-ledger.version` and `review-ledger.integrity` record which
  # published tarball these bytes came from; `gemini-platform` CI pins them.
  - source: .agents/skills/critique/scripts/review-ledger.js
    destination: .agents/skills/critique/scripts/review-ledger.js
    substitutions: []
    mode: '0644'

  - source: .agents/skills/critique/scripts/package.json
    destination: .agents/skills/critique/scripts/package.json
    substitutions: []
    mode: '0644'

  - source: .agents/skills/critique/scripts/review-ledger.version
    destination: .agents/skills/critique/scripts/review-ledger.version
    substitutions: []
    mode: '0644'

  - source: .agents/skills/critique/scripts/review-ledger.integrity
    destination: .agents/skills/critique/scripts/review-ledger.integrity
    substitutions: []
    mode: '0644'

