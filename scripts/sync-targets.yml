# Canonical sync manifest for codex-platform.
#
# `sync-engine.py` reads this file from the upstream checkout (this repo, or
# a fork of it) to learn which files to copy into a consumer repo, and which
# `<<KEY>>` placeholders to substitute from the consumer's
# `.platform-config.yml`.
#
# `substitutions: []` means verbatim copy. `delete: true` causes the engine
# to remove the destination from the consumer (and prune empty parent
# directories) — use this to retire a previously-synced file across all
# consumers. `mode` (e.g. `"0755"`) sets the destination permissions.
#
# Adding a new file to the sync surface = add an entry here. Consumers that
# don't want a particular file can opt out via `skip_targets` in their own
# `.platform-config.yml`; forks that want to drop or add files entirely can
# edit this manifest in the fork.

targets:
  # Codex skills — checked into consumer repo so teammates without the
  # global install can still invoke them. Devs who installed via
  # `scripts/install-skills.sh` will resolve from `~/.codex/skills/` first;
  # the in-repo copy is the fallback for everyone else and for CI contexts.
  - source: .codex/skills/issues/SKILL.md
    destination: .codex/skills/issues/SKILL.md
    substitutions: []

  - source: .codex/skills/issues/scripts/ready.py
    destination: .codex/skills/issues/scripts/ready.py
    substitutions: []
    mode: '0755'

  - source: .codex/skills/issues/scripts/link.py
    destination: .codex/skills/issues/scripts/link.py
    substitutions: []
    mode: '0755'

  - source: .codex/skills/refactorpass/SKILL.md
    destination: .codex/skills/refactorpass/SKILL.md
    substitutions: []

  - source: .codex/skills/critique/SKILL.md
    destination: .codex/skills/critique/SKILL.md
    substitutions: []

  - source: .codex/skills/critique/scripts/review-ledger.py
    destination: .codex/skills/critique/scripts/review-ledger.py
    substitutions: []
    mode: '0755'

  - source: .codex/skills/deepcritique/SKILL.md
    destination: .codex/skills/deepcritique/SKILL.md
    substitutions: []

  - source: .codex/skills/pr-critique/SKILL.md
    destination: .codex/skills/pr-critique/SKILL.md
    substitutions: []

  - source: .codex/skills/reviewit/SKILL.md
    destination: .codex/skills/reviewit/SKILL.md
    substitutions: []

  - source: .codex/skills/copilot-review/SKILL.md
    destination: .codex/skills/copilot-review/SKILL.md
    substitutions: []

  # Read-only GitHub Actions usage audit. Org-specific baselines live in a
  # consumer-owned, non-synced `.codex/actions-usage-audit.local.md`.
  - source: .codex/skills/actions-usage-audit/SKILL.md
    destination: .codex/skills/actions-usage-audit/SKILL.md
    substitutions: []

  # Secure npm package release and first-publication bootstrap workflow.
  - source: .codex/skills/publish-npm-package/SKILL.md
    destination: .codex/skills/publish-npm-package/SKILL.md
    substitutions: []

  - source: .codex/skills/publish-npm-package/agents/openai.yaml
    destination: .codex/skills/publish-npm-package/agents/openai.yaml
    substitutions: []

  - source: .codex/skills/publish-npm-package/references/upstream-docs.md
    destination: .codex/skills/publish-npm-package/references/upstream-docs.md
    substitutions: []

  - source: .codex/skills/publish-npm-package/scripts/release-preflight.py
    destination: .codex/skills/publish-npm-package/scripts/release-preflight.py
    substitutions: []
    mode: '0755'

  - source: .codex/skills/publish-npm-package/scripts/verify-published-package.py
    destination: .codex/skills/publish-npm-package/scripts/verify-published-package.py
    substitutions: []
    mode: '0755'

  - source: .codex/skills/ship-staging/SKILL.md
    destination: .codex/skills/ship-staging/SKILL.md
    substitutions: []

  - source: .codex/skills/phone-install/SKILL.md
    destination: .codex/skills/phone-install/SKILL.md
    substitutions: []

  - source: .codex/skills/feature-dev/SKILL.md
    destination: .codex/skills/feature-dev/SKILL.md
    substitutions: []

  # diagnosing-bugs — debugging discipline gated on a tight, deterministic
  # feedback loop that goes red on the user's exact symptom before any
  # hypothesis is entertained.
  - source: .codex/skills/diagnosing-bugs/SKILL.md
    destination: .codex/skills/diagnosing-bugs/SKILL.md
    substitutions: []

  - source: .codex/skills/task-packet/SKILL.md
    destination: .codex/skills/task-packet/SKILL.md
    substitutions: []

  - source: .codex/skills/agent-loop/SKILL.md
    destination: .codex/skills/agent-loop/SKILL.md
    substitutions: []

  - source: .codex/skills/agent-loop/scripts/agent-loop.sh
    destination: .codex/skills/agent-loop/scripts/agent-loop.sh
    substitutions: []
    mode: '0755'

  - source: .codex/skills/agent-loop/scripts/agent-loop-state.py
    destination: .codex/skills/agent-loop/scripts/agent-loop-state.py
    substitutions: []
    mode: '0755'

  - source: .codex/skills/agent-loop/scripts/review-push.sh
    destination: .codex/skills/agent-loop/scripts/review-push.sh
    substitutions: []
    mode: '0755'

  - source: .codex/skills/agent-loop/scripts/config-doctor.py
    destination: .codex/skills/agent-loop/scripts/config-doctor.py
    substitutions: []
