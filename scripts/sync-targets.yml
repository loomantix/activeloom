  # The Python ledger was replaced by the vendored `review-ledger.js` bundle.
  # Not order-dependent — the destination differs from the copy above by
  # extension, so the two entries cannot collide. Keep it here until every
  # consumer has run a sync that includes it, or repos keep a stale second
