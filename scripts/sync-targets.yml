# Canonical sync manifest for activeloom.
#
# `sync-engine.py` reads this file from the upstream checkout (this repo, or
# a fork of it) to learn which files to copy into a consumer repo, and which
# `<<KEY>>` placeholders to substitute from the consumer's
# `.activeloom-config.yml`.
#
# ## Shape
#
# The manifest emits one target set per harness plus one harness-independent
# `shared:` set. A consumer receives the union of the `shared:` set and the
# sets of every harness it declares in its config's `harnesses:` — so a repo
# that uses only Codex never sees a `.claude/**` write, and one that uses all
# three receives exactly what three separate upstreams used to deliver.
#
# Each harness declares:
#
#   `root`           the prompt directory it owns in a consumer. Descriptive,
#                    not enforcing: a harness may also ship a repo-root file
#                    (`agent-loop-instructions.md`), which is why the engine
#                    gates destinations through the consumer's
#                    `allowed_destinations` rather than through this value.
#   `legacy_config`  the pre-sync-v2 per-harness config filename. The engine's
#                    compatibility shim reads this to decide which harness a
#                    surviving legacy config file configures, so the mapping
#                    lives here as data rather than in the engine.
#   `targets`        that harness's target list.
#
# Harnesses are processed in declaration order. That only matters for a
# `create_if_missing` destination shipped by more than one harness
# (`agent-loop-instructions.md`): the first declared harness bootstraps the
# file and every later one preserves it.
#
# ## Target entries
#
# `substitutions: []` means verbatim copy. `delete: true` causes the engine
# to remove the destination from the consumer (and prune empty parent
# directories) — use this to retire a previously-synced file across all
# consumers. `mode` (e.g. `"0755"`) sets the destination permissions.
#
# Adding a new file to the sync surface = add an entry to the right set.
# Consumers that don't want a particular file can opt out via `skip_targets`
# in their own config; forks that want to drop or add files entirely can edit
# this manifest in the fork.

harnesses:
  # Claude Code. `root` holds the skills, agents, and shared configuration a
  # Claude consumer reads.
  claude:
    root: .claude
    legacy_config: .platform-config.yml
    targets:
      # Claude Code skills — checked into consumer repo so teammates without the
      # global install can still invoke them. Devs who installed via
      # `scripts/install-skills.sh` will resolve from `~/.claude/skills/` first;
      # the in-repo copy is the fallback for everyone else and for CI contexts.
      - source: .claude/skills/issues/SKILL.md
        destination: .claude/skills/issues/SKILL.md
        substitutions: []

      - source: .claude/skills/issues/scripts/ready.py
        destination: .claude/skills/issues/scripts/ready.py
        substitutions: []
        mode: '0755'

      - source: .claude/skills/issues/scripts/link.py
        destination: .claude/skills/issues/scripts/link.py
        substitutions: []
        mode: '0755'

      - source: .claude/skills/refactorpass/SKILL.md
        destination: .claude/skills/refactorpass/SKILL.md
        substitutions: []

      - source: .claude/skills/critique/SKILL.md
        destination: .claude/skills/critique/SKILL.md
        substitutions: []

      # The ledger is a build artifact of `@loomantix/review-ledger`, vendored
      # verbatim from the published tarball and run as `node review-ledger.js`.
      # Mode is 0644 deliberately: npm normalises non-`bin` files to 0644 in the
      # tarball, so the committed file is not executable and nothing may invoke it
      # as `./review-ledger.js`. `review-ledger.version` records which published
      # version these bytes came from; the `ledger-drift` job in *this* repo's CI
      # pins them to it. That job is not synced, so a consumer's copy is restored
      # by the next sync rather than verified locally.
      - source: .claude/skills/critique/scripts/review-ledger.js
        destination: .claude/skills/critique/scripts/review-ledger.js
        substitutions: []
        mode: '0644'

      - source: .claude/skills/critique/scripts/review-ledger.version
        destination: .claude/skills/critique/scripts/review-ledger.version
        substitutions: []
        mode: '0644'

      - source: .claude/skills/critique/scripts/review-ledger.integrity
        destination: .claude/skills/critique/scripts/review-ledger.integrity
        substitutions: []
        mode: '0644'

      # The pass-scoped usage extractor. Unlike the ledger bundle beside it, this
      # is maintained here rather than vendored: it parses this engine's session
      # log, which breaks on a CLI release, and the ledger package must never grow
      # a dependency on transcripts it has no business reading. Also ESM, and also
      # covered by the directory's `package.json` below.
      - source: .claude/skills/critique/scripts/usage-snapshot.js
        destination: .claude/skills/critique/scripts/usage-snapshot.js
        substitutions: []
        mode: '0644'

      # The prompt-stack hasher, which gives a telemetry record its prompt
      # identity. Separate from the usage extractor beside it because it reads only
      # files already checked into the consumer's repository — none of the
      # transcript-trust argument that keeps extraction out of the ledger applies
      # to it. Also ESM, and also covered by the directory's `package.json` below.
      - source: .claude/skills/critique/scripts/prompt-stack-hash.js
        destination: .claude/skills/critique/scripts/prompt-stack-hash.js
        substitutions: []
        mode: '0644'

      # Ship the generated stack declaration with the hasher so consumers can
      # compute this harness's prompt identity.
      - source: .claude/prompt-stack.json
        destination: .claude/prompt-stack.json
        substitutions: []
        mode: '0644'

      # The bundle is ESM. Node resolves module type from the NEAREST package.json
      # walking up from the file, which in a consumer is that repo's root — so
      # without this the ledger's module type depends on the consumer's manifest:
      # `"type": "commonjs"` is a hard SyntaxError, and an absent `type` works only
      # via Node's syntax detection (>=20.19/22.7) and warns on every invocation.
      # This directory holds only ESM scripts and their pin files, so scoping it to
      # ESM is safe and makes the runtime requirement independent of the consumer.
      - source: .claude/skills/critique/scripts/package.json
        destination: .claude/skills/critique/scripts/package.json
        substitutions: []
        mode: '0644'

      # Auto-relay launcher for the local `gemini` reviewer. Pins the model,
      # effort, permission, output, and timeout contract so no caller can
      # hand-compose an unattended reviewer command; executable because the
      # skills invoke it directly.
      - source: .claude/skills/critique/scripts/run-agy-review.sh
        destination: .claude/skills/critique/scripts/run-agy-review.sh
        substitutions: []
        mode: '0755'

      - source: .claude/skills/deepcritique/SKILL.md
        destination: .claude/skills/deepcritique/SKILL.md
        substitutions: []

      - source: .claude/skills/reviewit/SKILL.md
        destination: .claude/skills/reviewit/SKILL.md
        substitutions: []

      # /codex-review — independent second-opinion review via the Codex CLI
      # (read-only by default). Generic: assumes only an installed + authenticated
      # `codex` binary; no org-specific references. Same shape as /pr-stats and
      # /actions-usage-audit: repo-specific prompt scaffolding and invariants live
      # in a consumer-owned, non-synced `.claude/codex-review.local.md` the skill
      # reads if present.
      - source: .claude/skills/codex-review/SKILL.md
        destination: .claude/skills/codex-review/SKILL.md
        substitutions: []

      - source: .claude/references/local-review-ledger.md
        destination: .claude/references/local-review-ledger.md
        substitutions: []

      # /artifact — publish a deliverable as a hosted Artifact page. Generic:
      # the only org-specific content is the house token sheet, which travels
      # with it. Both entries move together — the skill tells the model to inline
      # `house-tokens.css`, so a consumer that receives one without the other
      # gets a skill pointing at a path that isn't there.
      - source: .claude/skills/artifact/SKILL.md
        destination: .claude/skills/artifact/SKILL.md
        substitutions: []

      - source: .claude/references/house-tokens.css
        destination: .claude/references/house-tokens.css
        substitutions: []

      # /actions-usage-audit — read-only org Actions-minute cost analysis. Generic
      # by design; org-specific baselines live in a consumer-owned, non-synced
      # `.claude/actions-usage-audit.local.md` the skill reads if present.
      - source: .claude/skills/actions-usage-audit/SKILL.md
        destination: .claude/skills/actions-usage-audit/SKILL.md
        substitutions: []

      # /pr-stats — read-only org PR-authorship counts per repo and per author.
      # Same shape as /actions-usage-audit: generic by design, with org-specific
      # knowledge (non-suffixed machine accounts, renamed repos) in a
      # consumer-owned, non-synced `.claude/pr-stats.local.md` it reads if present.
      # Needs `gawk` at run time; the skill checks and says so rather than
      # silently misreporting under mawk/BSD awk.
      - source: .claude/skills/pr-stats/SKILL.md
        destination: .claude/skills/pr-stats/SKILL.md
        substitutions: []

      - source: .claude/skills/copilot-review/SKILL.md
        destination: .claude/skills/copilot-review/SKILL.md
        substitutions: []

      - source: .claude/skills/feature-dev/SKILL.md
        destination: .claude/skills/feature-dev/SKILL.md
        substitutions: []

      # /diagnosing-bugs — model-invoked debugging discipline. Deliberately
      # model-invoked: its whole value is firing on "this is broken" before the
      # session has already guessed at a cause.
      - source: .claude/skills/diagnosing-bugs/SKILL.md
        destination: .claude/skills/diagnosing-bugs/SKILL.md
        substitutions: []

      - source: .claude/skills/task-packet/SKILL.md
        destination: .claude/skills/task-packet/SKILL.md
        substitutions: []

      - source: .claude/skills/phone-install/SKILL.md
        destination: .claude/skills/phone-install/SKILL.md
        substitutions: []

      # /review-accessibility — human-triggered axe-core audit of a running app.
      # Not part of the pre/post-push review chain. Two caveats worth knowing
      # before syncing it to a consumer:
      #   - it needs a browser tool family in the session (Claude in Chrome, or
      #     the Browser pane); repos whose devs run neither should `skip_targets`
      #     both entries rather than ship a skill that can't start.
      #   - `axe-scan.js` is one of two `.js` files on the sync surface (the other
      #     is the vendored `review-ledger.js` bundle above). It is a payload
      #     injected into a live page, never imported or built by the consumer.
      #     Repos that lint or format `.claude/**` should ignore it — it carries
      #     an `eslint-env browser` header for the common case.
      # /aws-infra-migration — fenced one-writer Terraform state cutover between
      # repos/CI systems. Read-mostly: every live state mutation is gated on an
      # explicit human go, and the skill never mutates state on its own initiative.
      # Narrower audience than the review-chain skills — it is driven from whichever
      # repo owns the destination Terraform pipeline, so consumers that own no
      # Terraform can `skip_targets` it rather than carry a runbook they never
      # invoke. Synced by default because "which repo owns Terraform" changes over
      # time and an absent skill is harder to discover than an unused one.
      - source: .claude/skills/aws-infra-migration/SKILL.md
        destination: .claude/skills/aws-infra-migration/SKILL.md
        substitutions: []

      - source: .claude/skills/review-accessibility/SKILL.md
        destination: .claude/skills/review-accessibility/SKILL.md
        substitutions: []

      - source: .claude/skills/review-accessibility/assets/axe-scan.js
        destination: .claude/skills/review-accessibility/assets/axe-scan.js
        substitutions: []

      - source: .claude/skills/agent-loop/SKILL.md
        destination: .claude/skills/agent-loop/SKILL.md
        substitutions: []

      - source: .claude/skills/agent-loop/scripts/agent-loop.sh
        destination: .claude/skills/agent-loop/scripts/agent-loop.sh
        substitutions: []
        mode: '0755'

      - source: .claude/skills/agent-loop/scripts/agent-loop-state.py
        destination: .claude/skills/agent-loop/scripts/agent-loop-state.py
        substitutions: []
        mode: '0755'

      - source: .claude/skills/agent-loop/scripts/review-push.sh
        destination: .claude/skills/agent-loop/scripts/review-push.sh
        substitutions: []
        mode: '0755'

      - source: .claude/skills/agent-loop/scripts/config-doctor.py
        destination: .claude/skills/agent-loop/scripts/config-doctor.py
        substitutions: []
        mode: '0755'

      - source: .claude/skills/agent-loop/scripts/hook-git-guard
        destination: .claude/skills/agent-loop/scripts/hook-git-guard
        substitutions: []
        mode: '0755'

      - source: .claude/skills/agent-loop/scripts/hook-gh-guard
        destination: .claude/skills/agent-loop/scripts/hook-gh-guard
        substitutions: []
        mode: '0755'

      # Consumer-owned overrides for the loop (e.g. base_branch for repos whose
      # integration branch != default branch). `create_if_missing: true` so each
      # repo customizes it once; the hash-locked agent-loop.sh stays a verbatim
      # overwrite target and reads this config for its base branch.
      - source: .claude/skills/agent-loop/agent-loop.config.template
        destination: .claude/skills/agent-loop/agent-loop.config
        substitutions: []
        create_if_missing: true

      # /agent-loop expects `agent-loop-instructions.md` at the consumer's repo
      # root. `create_if_missing: true` bootstraps the file from this template
      # on first sync, then leaves it alone — consumer customizations made
      # after the initial sync survive every subsequent run.
      - source: .claude/skills/agent-loop/agent-loop-instructions.md.template
        destination: agent-loop-instructions.md
        substitutions: []
        create_if_missing: true

      # Consumer-owned Claude prompt. `create_if_missing: true` bootstraps it
      # once; later upstream edits to `prompt.txt.template` no longer reach
      # already-onboarded consumers.
      - source: .claude/skills/agent-loop/prompt.txt.template
        destination: .claude/skills/agent-loop/prompt.txt
        substitutions: []
        create_if_missing: true

      # /backlog-refinement — curates the `dev: agent` queue that /agent-loop
      # consumes, and runs the post-loop RCA that sharpens the rubric from every
      # bail. SKILL.md + scripts are verbatim (overwrite); RUBRIC.md and
      # LEARNINGS.md are consumer-owned (bootstrapped from templates, then each
      # repo customizes the disqualifiers and accumulates its own learnings).
      - source: .claude/skills/backlog-refinement/SKILL.md
        destination: .claude/skills/backlog-refinement/SKILL.md
        substitutions: []

      - source: .claude/skills/backlog-refinement/scripts/candidates.py
        destination: .claude/skills/backlog-refinement/scripts/candidates.py
        substitutions: []
        mode: '0755'

      - source: .claude/skills/backlog-refinement/scripts/bail-report.py
        destination: .claude/skills/backlog-refinement/scripts/bail-report.py
        substitutions: []
        mode: '0755'

      # The agent-readiness rubric (criteria + disqualifier taxonomy) is the
      # source of truth shared with /agent-loop. `create_if_missing: true` lets
      # each repo tune its §3 disqualifiers (e.g. a repo-specific sensitive-path
      # exclusion) without upstream clobbering them.
      - source: .claude/skills/backlog-refinement/RUBRIC.md.template
        destination: .claude/skills/backlog-refinement/RUBRIC.md
        substitutions: []
        create_if_missing: true

      # Append-only RCA log — each repo accumulates its own learnings corpus.
      - source: .claude/skills/backlog-refinement/LEARNINGS.md.template
        destination: .claude/skills/backlog-refinement/LEARNINGS.md
        substitutions: []
        create_if_missing: true

      # Custom Claude Code agents that the synced skills depend on. /feature-dev
      # invokes code-explorer, code-architect, and code-reviewer. Without these
      # in each consumer's .claude/agents/, those skills fail with "agent not found".
      - source: .claude/agents/code-explorer.md
        destination: .claude/agents/code-explorer.md
        substitutions: []

      - source: .claude/agents/code-architect.md
        destination: .claude/agents/code-architect.md
        substitutions: []

      - source: .claude/agents/code-reviewer.md
        destination: .claude/agents/code-reviewer.md
        substitutions: []

      # Canonical workflow doc — referenced from each consumer's CLAUDE.md as
      # the source of truth for the AI review flow.
      - source: .claude/REVIEW_WORKFLOW.md
        destination: .claude/REVIEW_WORKFLOW.md
        substitutions: []

      # Prompt-authoring notes for the current default model. Synced because the
      # skills above are prompts: a consumer that writes its own skills or inline
      # `Agent(...)` prompts needs the same deltas (no severity cutoffs on review
      # agents, no self-verification scaffolding, bounded delegation, explicit
      # length ceilings) or it reintroduces the patterns this repo just removed.
      - source: .claude/MODEL_NOTES.md
        destination: .claude/MODEL_NOTES.md
        substitutions: []

      # Structural companion to MODEL_NOTES. Where those notes cover what the
      # current model does differently, this covers how to build the document:
      # invocation and what a `description` costs in always-loaded context,
      # where reference material sits relative to steps, checkable completion
      # criteria, and the pruning tests. Synced for the same reason MODEL_NOTES
      # is — a consumer writing its own skills needs both, and the context cost
      # of a badly-scoped skill is paid by every session in that repo.
      - source: .claude/SKILL_AUTHORING.md
        destination: .claude/SKILL_AUTHORING.md
        substitutions: []

      # Shared Claude Code settings, rendered from a template so the review
      # telemetry gates the consumer declares under `telemetry:` reach the
      # harness as environment configuration. `REVIEW_TELEMETRY_ENV` is
      # engine-computed and reserved: a consumer cannot set it under
      # `substitutions:`. It renders `{}` when the consumer declares no
      # gates, which sets no variable and so leaves a developer's own shell
      # environment untouched.
      - source: .claude/settings.json.template
        destination: .claude/settings.json
        substitutions:
          - REVIEW_TELEMETRY_ENV

      # Retired-stub deletes — keep these while consumers may still have legacy
      # files from an older sync surface. Each entry can be deleted from this
      # manifest once downstream syncs have processed it.
      - destination: .claude/skills/pushit/SKILL.md
        delete: true
      - destination: .claude/skills/review-cycle/SKILL.md
        delete: true
      - destination: .claude/hooks/check-simplify-state.sh
        delete: true
      # `/grill` and `/deepgrill` became `/critique` and `/deepcritique`. These
      # deletes are what make the rename atomic in a consumer: the same sync run
      # that writes the new paths removes the old ones, so no repo is ever left
      # holding two review skills that both claim to be the chain. Retiring these
      # entries early would strand the old copies as live, model-invocable skills
      # — keep them until every consumer has run a sync that includes them.
      - destination: .claude/skills/grill/SKILL.md
        delete: true
      - destination: .claude/skills/grill/scripts/review-ledger.py
        delete: true
      - destination: .claude/skills/deepgrill/SKILL.md
        delete: true
      # The Python ledger was replaced by the vendored `review-ledger.js` bundle.
      # Unlike the `/grill` rename this is NOT order-dependent — the destination
      # differs from the copy above by extension, so the two entries cannot
      # collide. It still has to stay here until every consumer has run a sync
      # that includes it, or repos keep a stale second ledger implementation that
      # `agent-loop.sh` no longer calls.
      - destination: .claude/skills/critique/scripts/review-ledger.py
        delete: true

      # ORDER-DEPENDENT — this entry must stay BELOW the `.claude/skills/grill/`
      # deletes above. The engine walks targets in list order with no dedup by
      # destination, so a copy placed before that delete is written and then
      # unlinked in the same run, and the consumer never receives the skill.
      #
      # `/grill` is the one destination in this manifest that is both retired and
      # reissued: the old review skill is deleted, then this new pre-code
      # interview skill is written to the same path. Ordered this way the
      # handover is atomic — a consumer is never left holding a `/grill` that
      # still claims to be the review chain. `tests/test_skill_frontmatter.py`
      # asserts the ordering so a future reshuffle of this file cannot silently
      # reintroduce the collision.
      #
      # User-invoked, so it costs no always-loaded description context; it is the
      # front end of the same arc /feature-dev and /task-packet finish.
      - source: .claude/skills/grill/SKILL.md
        destination: .claude/skills/grill/SKILL.md
        substitutions: []

  # Codex. Ships the cross-engine review roles under `references/roles/` that
  # the Claude tree expresses as `.claude/agents/` subagents instead.
  codex:
    root: .codex
    legacy_config: .codex-platform-config.yml
    targets:
      # Codex skills — checked into consumer repo so teammates without the
      # global install can still invoke them. Devs who installed via
      # `scripts/install-skills.sh` will resolve from `~/.codex/skills/` first;
      # the in-repo copy is the fallback for everyone else and for CI contexts.
      - source: .codex/skills/issues/SKILL.md
        destination: .codex/skills/issues/SKILL.md
        substitutions: []

      - source: .codex/skills/issues/scripts/ready.py
        destination: .codex/skills/issues/scripts/ready.py
        substitutions: []
        mode: '0755'

      - source: .codex/skills/issues/scripts/link.py
        destination: .codex/skills/issues/scripts/link.py
        substitutions: []
        mode: '0755'

      - source: .codex/skills/refactorpass/SKILL.md
        destination: .codex/skills/refactorpass/SKILL.md
        substitutions: []

      - source: .codex/skills/critique/SKILL.md
        destination: .codex/skills/critique/SKILL.md
        substitutions: []

      # The ledger is a build artifact of `@loomantix/review-ledger`, vendored
      # verbatim from the published tarball and run as `node review-ledger.js`.
      # Mode is 0644 deliberately: npm normalises non-`bin` files to 0644 in the
      # tarball, so the committed file is not executable and nothing may invoke it
      # as `./review-ledger.js`. The sibling `package.json` declaring
      # `"type": "module"` must sync with it — the bundle is ESM under a `.js`
      # name, so without it Node resolves the module type from the CONSUMER's root
      # manifest and a `"type": "commonjs"` repository fails with a SyntaxError.
      # `review-ledger.version` and `review-ledger.integrity` record which
      # published tarball these bytes came from; `codex-platform` CI pins them.
      - source: .codex/skills/critique/scripts/review-ledger.js
        destination: .codex/skills/critique/scripts/review-ledger.js
        substitutions: []
        mode: '0644'

      # The pass-scoped usage extractor. Unlike the ledger bundle beside it, this
      # is maintained here rather than vendored: it parses this engine's session
      # log, which breaks on a CLI release, and the ledger package must never grow
      # a dependency on transcripts it has no business reading. Also ESM, and also
      # covered by the directory's `package.json` below.
      - source: .codex/skills/critique/scripts/usage-snapshot.js
        destination: .codex/skills/critique/scripts/usage-snapshot.js
        substitutions: []
        mode: '0644'

      # The prompt-stack hasher, which gives a telemetry record its prompt
      # identity. Separate from the usage extractor beside it because it reads only
      # files already checked into the consumer's repository — none of the
      # transcript-trust argument that keeps extraction out of the ledger applies
      # to it. Also ESM, and also covered by the directory's `package.json` below.
      - source: .codex/skills/critique/scripts/prompt-stack-hash.js
        destination: .codex/skills/critique/scripts/prompt-stack-hash.js
        substitutions: []
        mode: '0644'

      # The unified manifest delivers Codex's generated declaration too; the
      # frozen pre-cutover Codex manifest intentionally remains unchanged.
      - source: .codex/prompt-stack.json
        destination: .codex/prompt-stack.json
        substitutions: []
        mode: '0644'

      - source: .codex/skills/critique/scripts/package.json
        destination: .codex/skills/critique/scripts/package.json
        substitutions: []
        mode: '0644'

      - source: .codex/skills/critique/scripts/review-ledger.version
        destination: .codex/skills/critique/scripts/review-ledger.version
        substitutions: []
        mode: '0644'

      - source: .codex/skills/critique/scripts/review-ledger.integrity
        destination: .codex/skills/critique/scripts/review-ledger.integrity
        substitutions: []
