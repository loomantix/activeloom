  - source: .codex/skills/agent-loop/scripts/hook-git-guard
    destination: .codex/skills/agent-loop/scripts/hook-git-guard
    substitutions: []
    mode: '0755'

  - source: .codex/skills/agent-loop/scripts/hook-gh-guard
    destination: .codex/skills/agent-loop/scripts/hook-gh-guard
    substitutions: []
    mode: '0755'

  # Consumer-owned base-branch override for promotion-flow repositories.
  - source: .codex/skills/agent-loop/agent-loop.config.template
    destination: .codex/skills/agent-loop/agent-loop.config
    substitutions: []
    create_if_missing: true

  # /agent-loop expects `agent-loop-instructions.md` at the consumer's repo
  # root. `create_if_missing: true` bootstraps the file from this template
  # on first sync, then leaves it alone — consumer customizations made
  # after the initial sync survive every subsequent run.
  - source: .codex/skills/agent-loop/agent-loop-instructions.md.template
    destination: agent-loop-instructions.md
    substitutions: []
    create_if_missing: true

  # Consumer-owned Codex prompt. `create_if_missing: true` bootstraps it
  # once; later upstream edits to `prompt.txt.template` no longer reach
  # already-onboarded consumers.
  - source: .codex/skills/agent-loop/prompt.txt.template
    destination: .codex/skills/agent-loop/prompt.txt
    substitutions: []
    create_if_missing: true

  # /backlog-refinement curates the dev: agent queue consumed by /agent-loop.
  # RUBRIC.md and LEARNINGS.md are consumer-owned so each repo can evolve its
  # own safety envelope and retain lessons from autonomous-run bails.
  - source: .codex/skills/backlog-refinement/SKILL.md
    destination: .codex/skills/backlog-refinement/SKILL.md
    substitutions: []

  - source: .codex/skills/backlog-refinement/scripts/candidates.py
    destination: .codex/skills/backlog-refinement/scripts/candidates.py
    substitutions: []
    mode: '0755'

  - source: .codex/skills/backlog-refinement/scripts/bail-report.py
    destination: .codex/skills/backlog-refinement/scripts/bail-report.py
    substitutions: []
    mode: '0755'

  - source: .codex/skills/backlog-refinement/RUBRIC.md.template
    destination: .codex/skills/backlog-refinement/RUBRIC.md
    substitutions: []
