  - source: .codex/skills/backlog-refinement/LEARNINGS.md.template
    destination: .codex/skills/backlog-refinement/LEARNINGS.md
    substitutions: []
    create_if_missing: true

  # Long role prompts are references, not always-loaded agent definitions.
  # Skills load them only when they need a specialized stance.
  - source: .codex/references/roles/code-explorer.md
    destination: .codex/references/roles/code-explorer.md
    substitutions: []

  - source: .codex/references/roles/code-architect.md
    destination: .codex/references/roles/code-architect.md
    substitutions: []

  - source: .codex/references/roles/code-reviewer.md
    destination: .codex/references/roles/code-reviewer.md
    substitutions: []

  - source: .codex/references/roles/silent-failure-hunter.md
    destination: .codex/references/roles/silent-failure-hunter.md
    substitutions: []

  - source: .codex/references/roles/type-design-analyzer.md
    destination: .codex/references/roles/type-design-analyzer.md
    substitutions: []

  - source: .codex/references/roles/comment-analyzer.md
    destination: .codex/references/roles/comment-analyzer.md
    substitutions: []

  - source: .codex/references/roles/pr-test-analyzer.md
    destination: .codex/references/roles/pr-test-analyzer.md
    substitutions: []

  - source: .codex/references/roles/security-reviewer.md
    destination: .codex/references/roles/security-reviewer.md
    substitutions: []

  - source: .codex/references/local-review-ledger.md
    destination: .codex/references/local-review-ledger.md
    substitutions: []

  # Canonical workflow doc — referenced from each consumer's AGENTS.md as
  # the source of truth for the AI review flow.
  - source: .codex/REVIEW_WORKFLOW.md
    destination: .codex/REVIEW_WORKFLOW.md
    substitutions: []

  # Retired-stub deletes — keep entries here when removing a previously
  # synced file so consumers prune it on their next sync run.
  - destination: .codex/skills/pushit/SKILL.md
    delete: true
  - destination: .codex/skills/review-cycle/SKILL.md
    delete: true
  - destination: .codex/hooks/check-simplify-state.sh
    delete: true
  # The review chain moved from `grill` terminology to `critique`. Keep these
  # deletes until every consumer has synced this manifest, so a fleet sync does
  # not leave duplicate model-invocable review skills behind.
  #
  # This is ordered best-effort removal, not an atomic swap. The engine applies
  # targets in one non-transactional pass, so a run that fails partway leaves
  # the new skills written and these deletes unapplied. A retired destination is
  # also left in place when a consumer explicitly lists it in `skip_targets`.
  #
  # Consumers with a non-empty `allowed_destinations` must add
  # `.codex/skills/critique/**`, `.codex/skills/deepcritique/**`, and
  # `.codex/skills/pr-critique/**` to that allowlist before taking the sync tag
  # carrying this rename. Otherwise the new copy targets above fail the
  # allowlist gate and the run aborts before reaching these deletes. Retired
  # paths survive, along with any earlier new copy targets already written.
  #
  # Add the new patterns, but do not drop the retired ones yet. The allowlist
  # gate applies to delete targets as well as copies, so a consumer that swaps
  # `grill`/`deepgrill`/`pr-grill` out of the allowlist aborts on the deletes
  # below and ends up with both naming families installed. Keep the three
  # retired patterns allowlisted until these delete entries leave the manifest.
  - destination: .codex/skills/grill/SKILL.md
    delete: true
  - destination: .codex/skills/grill/scripts/review-ledger.py
    delete: true
  - destination: .codex/skills/deepgrill/SKILL.md
    delete: true
  - destination: .codex/skills/pr-grill/SKILL.md
    delete: true

  # ORDER-DEPENDENT — this entry must stay BELOW the `.codex/skills/grill/`
  # deletes above. The engine applies targets in list order with no dedup by
  # destination, so a copy placed before that delete is written and then
  # unlinked in the same run, and the consumer never receives the skill.
  #
  # `grill` is the one destination in this manifest that is both retired and
  # reissued: the old review skill is deleted, then this new pre-code
  # interview skill is written to the same path. The caveats on the retirement
  # block above apply here too — the pass is not transactional, so a run that
  # aborts partway can leave the old skill in place with the new one unwritten.
  # `tests/test_skill_surface.py` asserts the ordering so a future reshuffle of
  # this file cannot silently reintroduce the collision.
  #
  # Front end of the arc feature-dev and task-packet finish; the adversarial
  # review skills are critique / deepcritique / pr-critique.
  - source: .codex/skills/grill/SKILL.md
    destination: .codex/skills/grill/SKILL.md
    substitutions: []

  # Copilot instructions — generated from the template using the consumer's
  # placeholder values. Result lands at `.github/copilot-instructions.md`.
  - source: .github/copilot-instructions.md.template
    destination: .github/copilot-instructions.md
    substitutions:
      - PROJECT_NAME
      - PROJECT_OVERVIEW
      - CANONICAL_DOCS
      - STACK_TABLE
      - CODE_RULES
      - DOMAIN_RULES
      - REVIEW_FOCUS
      - WHAT_NOT_TO_SUGGEST_EXTRA
    # Every key here sits alone on its template line between blank separators.
    # When the value is empty, remove its vacated line plus one separator so
    # the render stays prettier-clean. Never opt in keys used inside literal
    # content — the `sync-targets` CI job enforces both halves of that rule.
    # `PROJECT_NAME` and `CANONICAL_DOCS` are inline and so cannot qualify.
    collapse_empty_substitutions:
      - PROJECT_OVERVIEW
      - STACK_TABLE
      - CODE_RULES
      - DOMAIN_RULES
      - REVIEW_FOCUS
      - WHAT_NOT_TO_SUGGEST_EXTRA

  # DCO sign-off check — only relevant for OSS consumers (Apache 2 + DCO is
  # the standard contract). The canonical version uses `git rev-list
  # --no-merges` so "Update branch" merge commits, which lack a
  # Signed-off-by trailer, don't fail the check. Private consumers that
  # don't need DCO opt out via `skip_targets` in their `.platform-config.yml`.
  - source: .github/workflows/dco.yml
    destination: .github/workflows/dco.yml
    substitutions: []
