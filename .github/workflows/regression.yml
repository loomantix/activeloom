name: Regression

on:
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:

concurrency:
  group: regression-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      # Integration cases execute the vendored Node helpers.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install pinned tooling
        run: |
          python3 -m pip install \
            'pyyaml==6.0.2' \
            'pytest==8.3.4' \
            'pytest-cov==6.0.0' \
            'pytest-xdist==3.8.0' \
            'pytest-split==0.11.0' \
            'coverage==7.16.0'
      - name: Configure git identity (parse_status tests use a fixture git repo)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Install prompt authoring dependencies
        run: npm ci --prefix prompts --ignore-scripts
      # least_duration distributes individual cases, including the expensive
      # agent-loop cases, across runners. Without a timing baseline it balances
      # counts; JUnit artifacts provide timings for subsequent tuning.
      - name: Record full and selected collections
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p shard-results
          python3 -m pytest tests/ --test-lane=regression --collect-only -q > shard-results/full.txt
          python3 -m pytest tests/ --test-lane=regression --collect-only -q --splits 4 --group "$SHARD" \
            --splitting-algorithm least_duration > shard-results/selected.txt
      # Explicit --cov-config also gives subprocesses branch coverage settings.
      - name: Run pytest with four workers + write coverage data
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          python3 -m pytest tests/ --test-lane=regression --cov --cov-config=pyproject.toml
          --cov-report=term-missing -ra --durations=30 -n 4 --dist worksteal
          --splits 4 --group "$SHARD" --splitting-algorithm least_duration
          --junitxml=shard-results/junit.xml
      - name: Collect coverage
        if: '!cancelled()'
        run: cp .coverage shard-results/.coverage
      - name: Upload shard results
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: python-shard-${{ matrix.shard }}
          path: shard-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  regression-coverage:
    name: Regression coverage
    needs: python-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful regression shards
        env:
          TEST_RESULT: ${{ needs.python-tests.result }}
        run: test "$TEST_RESULT" = success
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install coverage
        run: python3 -m pip install 'coverage==7.16.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: python-shard-*
          path: python-results
      - name: Verify complete partition and combine coverage
        run: |
          python3 scripts/verify-pytest-shards.py python-results
          python3 -m coverage combine python-results/python-shard-*/.coverage
      # Per-file gate matches the security contract: a future refactor
      # that spikes one file's coverage can't paper over a regression
      # in the other. The `test -f` precondition is load-bearing —
      # `coverage report --include=<missing>` exits 0 with "No data to
      # report", silently passing the gate if a file gets renamed.
      - name: Coverage gate — sync-engine.py >=80%
        run: |
          test -f scripts/sync-engine.py
          python3 -m coverage report --include='scripts/sync-engine.py' --fail-under=80
      - name: Coverage gate — create-signed-commit.py >=80%
        run: |
          test -f scripts/create-signed-commit.py
          python3 -m coverage report --include='scripts/create-signed-commit.py' --fail-under=80
      # The renderer decides what lands in three harness roots and, through
      # them, in every consumer. Same 80% floor and the same `test -f`
      # precondition as the two above: `coverage report --include=<missing>`
      # exits 0 with "No data to report", so a rename would otherwise pass this
      # gate silently.
      - name: Coverage gate — render-prompts.py >=80%
        run: |
          test -f scripts/render-prompts.py
          python3 -m coverage report --include='scripts/render-prompts.py' --fail-under=80
      # The parity lint is the renderer's counterpart: it decides whether an
      # unrendered divergence is accounted for. Same floor, same `test -f`
      # precondition, for the same reason.
      - name: Coverage gate — lint-prompt-parity.py >=80%
        run: |
          test -f scripts/lint-prompt-parity.py
          python3 -m coverage report --include='scripts/lint-prompt-parity.py' --fail-under=80

  # A scheduled run has no pull request to turn red, so a failure would
  # otherwise sit unnoticed on the Actions tab. Keep one open issue and add
  # each further failure to it.
  report-failure:
    name: Report scheduled failure
    needs: [python-tests, regression-coverage]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the regression failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly regression suite is failing"
          body="The scheduled Regression workflow failed at ${GITHUB_SHA}: ${RUN_URL}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
