name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` fires when a stacked PR is auto-retargeted to main as its parent
    # merges. With the branches filter above and no `edited`, that PR would run
    # zero CI and sit blocked until someone pushed to it.
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        converted_to_draft,
      ]

concurrency:
  # Obsolete PR heads may be cancelled; preserve every main verdict because
  # main is the source for tagged consumer syncs. `cancel-in-progress: false`
  # alone does not preserve them: it protects the in-progress run, but a newly
  # queued run cancels any run already pending in the group, so back-to-back
  # merges would drop the middle commit's verdict. Giving every non-PR run its
  # own group means nothing ever queues behind anything.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  draft-preflight:
    name: Draft preflight
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check changed and interpreted files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$HEAD_SHA"
          git ls-files -z '*.py' | xargs -0 -r python3 -m py_compile
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n

  # ---------------------------------------------------------------------------
  # Consolidated static checks.
  #
  # These ten checks used to be ten separate jobs. Each did seconds of real
  # work, but GitHub bills a 1-minute minimum PER JOB and each one re-paid the
  # same runner allocation, checkout, and toolchain install. Measured over
  # August 2026: `CI` averaged 12.8 billed minutes per run across 147 runs
  # (~1,874 min/month), of which ~6 min was the real `Python types + tests`
  # work and the rest was ten trivial jobs.
  #
  # One job pays setup once. Each check keeps its own step so the Actions UI
  # still shows which one failed, and `if: '!cancelled()'` means a failure in
  # an early check does not hide the later ones — the property that separate
  # jobs gave for free and the reason to be careful here.
  #
  # `fetch-depth: 0` is required by the skill-content lint, which diffs against
  # the PR base; it was set on that job's checkout and is preserved here.
  # `RENDER_DIR` is exported by the render step into `$GITHUB_ENV` and consumed
  # by the three steps after it — same job, so this still works.
  #
  # `Python types + tests` deliberately stays its own job: it is ~6 minutes of
  # genuine work and running it in parallel keeps wall clock down.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Static checks
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Required by `Lint changed skill/agent content`, which diffs the PR
          # against its base ref.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Python tooling
        run: python3 -m pip install 'pyyaml==6.0.2' 'ruff==0.9.10'

      # --- was job `python` (Python lint + syntax) ---
      - name: Compile-check every Python source
        if: '!cancelled()'
        run: |
          set -euo pipefail
          mapfile -t pyfiles < <(git ls-files '*.py')
          if [ "${#pyfiles[@]}" -eq 0 ]; then
            echo "(no Python files found)"
            exit 0
          fi
          python3 -m py_compile "${pyfiles[@]}"
      - name: Ruff lint
        if: '!cancelled()'
        run: ruff check .

      # --- was job `shell` (Shell syntax + shellcheck) ---
      - name: bash -n every shell script
        if: '!cancelled()'
        run: |
          set -euo pipefail
          mapfile -t shfiles < <(git ls-files '*.sh')
          for f in "${shfiles[@]}"; do
            bash -n "$f"
          done
      - name: shellcheck (warnings allowed; errors fail)
        if: '!cancelled()'
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          severity: error

      # --- was job `yaml` (YAML syntax) ---
      - name: Parse every YAML file
        if: '!cancelled()'
        run: |
          set -euo pipefail
          mapfile -t ymlfiles < <(git ls-files '*.yml' '*.yaml')
          for f in "${ymlfiles[@]}"; do
            # `.template` files often contain literal `<placeholders>` that
            # are still valid YAML — parse-only check is sufficient.
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f"
          done

      # --- was job `format` (Prettier check) ---
      - name: Prettier --check
        if: '!cancelled()'
        run: npx --yes prettier@3.8.3 --check .

      # --- was job `ledger-drift` (Vendored review-ledger matches its published tarball) ---
      - name: Byte-compare against the pinned published version
        if: '!cancelled()'
        run: |
          set -euo pipefail
          scripts_dir=.claude/skills/critique/scripts
          version="$(tr -d '[:space:]' < "$scripts_dir/review-ledger.version")"
          [ -n "$version" ] || { echo "::error::review-ledger.version is empty"; exit 1; }
          expected_integrity="$(tr -d '[:space:]' < "$scripts_dir/review-ledger.integrity")"
          [ -n "$expected_integrity" ] || { echo "::error::review-ledger.integrity is empty"; exit 1; }
          workdir="$(mktemp -d)"
          # Run from a temp dir and pin the registry explicitly: a repo-root
          # `.npmrc` must not be able to redirect `@loomantix` to another host.
          # `--silent` still prints the tarball name npm chose, so use that
          # rather than re-deriving npm's scope-to-dash naming by hand.
          tarball="$(cd "$workdir" && npm pack "@loomantix/review-ledger@$version" \
            --registry https://registry.npmjs.org/ --ignore-scripts --silent)"
          # A bare version is a mutable name. Bind the bytes we fetched to the
          # sha512 recorded at vendoring time, so an unpublish/republish or a
          # tampered registry response fails closed instead of redefining what
          # "matches its published tarball" means.
          actual_integrity="sha512-$(openssl dgst -sha512 -binary "$workdir/$tarball" | base64 -w0)"
          if [ "$actual_integrity" != "$expected_integrity" ]; then
            echo "::error::@loomantix/review-ledger@$version tarball integrity mismatch"
            echo "  expected: $expected_integrity"
            echo "  actual:   $actual_integrity"
            exit 1
          fi
          # The package is published by the upstream OIDC pipeline with SLSA
          # provenance. `npm audit signatures` needs an installed tree, so
          # verify in a separate dir; together with the hash compare above this
          # binds the bytes we vendored to a registry record that is both
          # signed and attested, rather than to a mutable version string.
          auditdir="$(mktemp -d)"
          (
            cd "$auditdir"
            npm init -y >/dev/null 2>&1
            npm install "@loomantix/review-ledger@$version" \
              --registry https://registry.npmjs.org/ \
              --ignore-scripts --no-audit --no-fund --silent
            npm audit signatures
          ) || {
            echo "::error::signature/provenance verification failed for @loomantix/review-ledger@$version"
            exit 1
          }
          tar xzf "$workdir/$tarball" -C "$workdir"
          published="$workdir/package/dist/review-ledger.bundle.js"
          test -f "$published" || {
            echo "::error::published tarball has no dist/review-ledger.bundle.js — package layout changed"
            exit 1
          }
          if ! cmp -s "$published" "$scripts_dir/review-ledger.js"; then
            echo "::error::$scripts_dir/review-ledger.js does not match @loomantix/review-ledger@$version"
            echo "Re-vendor it verbatim; never edit or locally rebuild the bundle:"
            echo "  npm pack @loomantix/review-ledger@$version"
            echo "  tar xzf loomantix-review-ledger-$version.tgz"
            echo "  cp package/dist/review-ledger.bundle.js $scripts_dir/review-ledger.js"
            exit 1
          fi
      - name: Vendored ledger speaks review contract v3
        if: '!cancelled()'
        run: |
          set -euo pipefail
          if ! actual="$(node .claude/skills/critique/scripts/review-ledger.js --protocol-version 2>&1)"; then
            echo "::error::node could not execute the vendored ledger: $actual"
            exit 1
          fi
          [ "$actual" = 3 ] || {
            echo "::error::vendored ledger reports protocol '$actual', contract v3 requires 3"
            exit 1
          }

      - name: Vendored ledger self-identifies as the pinned version
        if: '!cancelled()'
        # The byte-compare above proves the file came from the tarball the pin
        # names. This proves the artifact agrees about which version that is:
        # `--version` is injected into the bundle at build time, so a build
        # whose injection silently degraded (`0.0.0-dev`) would otherwise sit
        # here indistinguishable from a good one, and every downstream consumer
        # would trust a pin file the artifact itself cannot corroborate.
        run: |
          set -euo pipefail
          scripts_dir=.claude/skills/critique/scripts
          pinned="$(tr -d '[:space:]' < "$scripts_dir/review-ledger.version")"
          if ! reported="$(node "$scripts_dir/review-ledger.js" --version 2>&1)"; then
            echo "::error::node could not execute the vendored ledger: $reported"
            exit 1
          fi
          [ "$reported" = "$pinned" ] || {
            echo "::error::vendored ledger reports version '$reported', but review-ledger.version pins '$pinned'"
            exit 1
          }

      # --- was job `accessibility-asset` (Accessibility asset sanitization) ---
      - name: Test sanitized browser output contract
        if: '!cancelled()'
        run: node --test tests/review-accessibility-asset.test.js

      # --- was job `render-check` (Rendered template fidelity) ---
      - name: Render sync surface against fixture consumer
        if: '!cancelled()'
        run: |
          set -euo pipefail
          CONSUMER=$(mktemp -d)
          cp tests/fixtures/render-check/.platform-config.yml "$CONSUMER/"
          python3 scripts/sync-engine.py \
            --upstream-repo . \
            --consumer-dir "$CONSUMER"
          echo "RENDER_DIR=$CONSUMER" >> "$GITHUB_ENV"
      - name: Prettier --check rendered output
        if: '!cancelled()'
        run: |
          set -euo pipefail
          # Pin the same prettier version as the `format` job. --config is
          # required: the rendered tree lives outside the repo, so config
          # discovery would otherwise find nothing and fall back to defaults.
          npx --yes prettier@3.8.3 --config .prettierrc --check \
            "$RENDER_DIR/.github/copilot-instructions.md"
      - name: Verify telemetry review surface reaches consumers exactly
        if: '!cancelled()'
        run: |
          set -euo pipefail
          for path in \
            .claude/REVIEW_WORKFLOW.md \
            .claude/skills/critique/SKILL.md \
            .claude/skills/critique/scripts/usage-snapshot.js \
            .claude/skills/critique/scripts/prompt-stack-hash.js \
            .claude/skills/deepcritique/SKILL.md \
            .claude/skills/refactorpass/SKILL.md; do
            cmp "$path" "$RENDER_DIR/$path"
          done
          for script in usage-snapshot.js prompt-stack-hash.js; do
            test "$(stat -c '%a' "$RENDER_DIR/.claude/skills/critique/scripts/$script")" = 644
          done
      - name: Render fidelity fixture and compare against golden
        if: '!cancelled()'
        run: |
          set -euo pipefail
          # Render from a throwaway upstream tree so the fixture template is
          # never a real sync target and can never reach a consumer.
          UPSTREAM=$(mktemp -d)
          CONSUMER=$(mktemp -d)
          mkdir -p "$UPSTREAM/scripts"
          cp tests/fixtures/render-fidelity/sync-targets.yml "$UPSTREAM/scripts/"
          cp tests/fixtures/render-fidelity/template.md "$UPSTREAM/"
          cp tests/fixtures/render-fidelity/.platform-config.yml "$CONSUMER/"
          python3 scripts/sync-engine.py \
            --upstream-repo "$UPSTREAM" \
            --consumer-dir "$CONSUMER"
          diff -u tests/fixtures/render-fidelity/expected.md "$CONSUMER/rendered.md"
          npx --yes prettier@3.8.3 --config .prettierrc --check \
            "$CONSUMER/rendered.md"

      # --- rendered prompt roots are current ---
      # The skills in `prompts/skills/` are single-sourced and rendered into
      # `.claude/`, `.codex/`, and `.agents/`. Those committed files are the
      # harness-specific distribution artifacts, which means they can go stale
      # against their source, or be hand-edited in the root instead of the
      # source. This is the gate that makes either one fail: it re-renders from
      # `prompts/` and byte-compares against what is committed, and prints a
      # diff per drifted file. Same shape as the `ledger-drift` check above,
      # which byte-compares vendored bytes against their published tarball.
      #
      # It needs the pinned Node from this job's `setup-node`: the renderer
      # normalizes its Markdown with the same pinned Prettier as
      # `Prettier --check`, because substituting values of different widths into
      # a Markdown table changes the alignment Prettier enforces.
      - name: Rendered prompt roots are current
        if: '!cancelled()'
        run: python3 scripts/render-prompts.py --check

      # The other half of the same contract: the renderer proves the generated
      # roots match their source, this proves every shared skill the renderer
      # does *not* own still has a written reason to differ. Promotion
      # candidates are reported into the job summary rather than failing —
      # see `docs/prompt-rendering.md`.
      - name: Unrendered shared skills are accounted for
        if: '!cancelled()'
        run: python3 scripts/lint-prompt-parity.py

      # --- was job `skill-content` (Skill content policy) ---
      - name: Self-test the lint patterns
        if: '!cancelled()'
        run: python3 .claude/lint-skill-content.py --self-test
      - name: Lint changed skill/agent content
        if: '!cancelled()'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${GITHUB_BASE_REF:-}" ]; then
              echo "GITHUB_BASE_REF empty for pull_request event — aborting." >&2
              exit 1
            fi
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            base="origin/${GITHUB_BASE_REF}"
          else
            base="HEAD~1"
          fi
          python3 .claude/lint-skill-content.py --base "$base"
      # Whole-tree scan, alongside the diff scan above — neither subsumes the
      # other. The diff scan reads what a PR adds, with line-precise
      # attribution. This one covers the class the diff scan structurally
      # cannot: lines that entered the tree before the tree was in scope,
      # which is what a subtree import or a scope widening produces. Standing
      # exceptions live in `.claude/skill-content-suppressions.allowlist`,
      # and a stale entry there fails this step.
      - name: Lint every skill/agent/reference prompt in scope
        if: '!cancelled()'
        run: python3 .claude/lint-skill-content.py --all

      # --- was job `claude-cli-invocations` (claude CLI invocation policy) ---
      - name: Self-test the lint patterns (claude-cli-invocations)
        if: '!cancelled()'
        run: python3 .claude/lint-claude-cli-invocations.py --self-test
      # Whole-tree scan, not diff-based — resists splitting a weaponizing
      # change across two PRs to escape the gate.
      - name: Lint synced shell scripts for `claude --` invocations
        if: '!cancelled()'
        run: python3 .claude/lint-claude-cli-invocations.py

      # --- was job `sync-targets` (sync-targets.yml matches schema) ---
      - name: Validate the canonical manifest parses + has expected shape
        if: '!cancelled()'
        run: |
          python3 - <<'PY'
          import yaml, sys
          doc = yaml.safe_load(open('scripts/sync-targets.yml'))
          targets = doc.get('targets')
          assert isinstance(targets, list) and targets, "targets must be a non-empty list"
          for t in targets:
              assert isinstance(t, dict), f"non-mapping target: {t!r}"
              if t.get('delete'):
                  assert 'destination' in t, f"delete target missing destination: {t!r}"
              else:
                  assert 'source' in t and 'destination' in t, f"copy target missing keys: {t!r}"
                  substitutions = t.get('substitutions', [])
                  assert isinstance(substitutions, list) and all(
                      isinstance(key, str) for key in substitutions
                  ), f"substitutions must be a string list: {t!r}"
                  collapse = t.get('collapse_empty_substitutions', [])
                  assert isinstance(collapse, list) and all(
                      isinstance(key, str) for key in collapse
                  ), f"collapse_empty_substitutions must be a string list: {t!r}"
                  assert set(collapse) <= set(substitutions), (
                      f"collapse_empty_substitutions must be declared substitutions: {t!r}"
                  )
          print(f"OK: {len(targets)} targets")
          PY

      # The engine deliberately owns no Markdown knowledge, so nothing at render
      # time stops a key opted into structural collapsing from deleting a line of
      # a fenced block, a raw <pre>, or an indented code block. Enforce the
      # "prose-only, whole-line" rule here instead, where reading the template is
      # cheap and a violation is an authoring mistake rather than consumer churn.
      - name: Lint collapse opt-ins against their template sites
        if: '!cancelled()'
        run: python3 scripts/lint-collapse-sites.py
  python-types-and-tests:
    name: Python types + tests
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # Cache the resolved wheel cohort against the pinned-tool list
          # below — the pins never drift within a PR, so the cache hits
          # on every iter-fix push (~15s saved per re-run).
          cache: pip
          cache-dependency-path: pyproject.toml
      # The suite shells out to the vendored `review-ledger.js` bundle a few
      # hundred times per run, so this job needs a pinned Node exactly like
      # `format`, `ledger-drift`, `accessibility-asset`, and `render-check`.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install pinned tooling
        run: |
          python3 -m pip install \
            'mypy==1.13.0' \
            'pyyaml==6.0.2' \
            'types-PyYAML==6.0.12.20240917' \
            'pytest==8.3.4' \
            'pytest-cov==6.0.0' \
            'coverage==7.16.0'
      - name: mypy --strict (config from pyproject.toml)
        run: python3 -m mypy
      - name: Configure git identity (parse_status tests use a fixture git repo)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      # `--cov-config` is load-bearing, not decoration. pytest-cov only
      # exports `COV_CORE_CONFIG` (the config path every auto-started
      # subprocess reads) when `--cov-config` names a file that exists;
      # its default is `.coveragerc`, which this repo does not ship, so
      # the variable degrades to `:` and subprocess coverage runs with no
      # config at all — statement-only, because `branch = true` lives in
      # pyproject.toml. The in-process run still sees the branch flag via
      # coverage's own default-file search, so the two halves disagree and
      # `coverage combine` fails with "Can't combine statement coverage
      # data with branch data" as soon as any subprocess records a line.
      # coverage <7.16.0 merged the mismatch silently.
      - name: Run pytest + write coverage data
        run: >-
          python3 -m pytest tests/ --cov --cov-config=pyproject.toml
          --cov-report=term-missing -ra
      # Per-file gate matches the security contract: a future refactor
      # that spikes one file's coverage can't paper over a regression
      # in the other. The `test -f` precondition is load-bearing —
      # `coverage report --include=<missing>` exits 0 with "No data to
      # report", silently passing the gate if a file gets renamed.
      - name: Coverage gate — sync-engine.py >=80%
        run: |
          test -f scripts/sync-engine.py
          python3 -m coverage report --include='scripts/sync-engine.py' --fail-under=80
      - name: Coverage gate — create-signed-commit.py >=80%
        run: |
          test -f scripts/create-signed-commit.py
          python3 -m coverage report --include='scripts/create-signed-commit.py' --fail-under=80
      # The renderer decides what lands in three harness roots and, through
      # them, in every consumer. Same 80% floor and the same `test -f`
      # precondition as the two above: `coverage report --include=<missing>`
      # exits 0 with "No data to report", so a rename would otherwise pass this
      # gate silently.
      - name: Coverage gate — render-prompts.py >=80%
        run: |
          test -f scripts/render-prompts.py
          python3 -m coverage report --include='scripts/render-prompts.py' --fail-under=80
      # The parity lint is the renderer's counterpart: it decides whether an
      # unrendered divergence is accounted for. Same floor, same `test -f`
      # precondition, for the same reason.
      - name: Coverage gate — lint-prompt-parity.py >=80%
        run: |
          test -f scripts/lint-prompt-parity.py
          python3 -m coverage report --include='scripts/lint-prompt-parity.py' --fail-under=80
