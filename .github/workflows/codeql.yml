name: CodeQL

# Sync engine + create-signed-commit run with cross-org org-scoped App
# tokens in the consumer fleet. CodeQL's default Python query suite
# catches taint flows that ruff and mypy don't — explicit defense
# against a logic-bomb landing in this repo while consumers pull from
# it daily.

on:
  push:
    # Push-event scan on main establishes the baseline that GitHub Code
    # Scanning needs to auto-dismiss fixed alerts. Without it, resolved
    # findings linger as stale entries in the Security tab.
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    # Weekly scan so a query-suite improvement at upstream catches
    # latent vulnerabilities even if no PR touched the file.
    - cron: '17 9 * * 1'

concurrency:
  # Preserve every main and scheduled baseline scan while cancelling obsolete
  # PR heads. Keying non-PR runs on the run id rather than on `github.ref` is
  # what preserves them: `schedule` and `push` both resolve `github.ref` to
  # refs/heads/main, so they would share one group, and a queued run cancels
  # whatever is already pending there — silently dropping a weekly scan.
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (Python)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          queries: +security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:python'
