# This file configures local tooling only (pytest, mypy, coverage,
# ruff) — the repo is not pip-installable, so there's no `[project]`
# table. PEP 518 lets `[tool.*]` sections stand alone.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
  "error:::sync_engine",
  "error:::lint_collapse_sites",
  "error:::create_signed_commit",
  "error:::ready",
]

[tool.coverage.run]
branch = true
source = ["scripts", ".agents/skills/publish-npm-package/scripts"]
omit = ["tests/*"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["scripts"]
files = ["scripts", "tests", ".agents/skills/publish-npm-package/scripts"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = false
