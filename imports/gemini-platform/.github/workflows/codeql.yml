name: CodeQL

# Sync engine and commit signing helpers run in automated CI workflows.
# CodeQL's default Python query suite catches taint flows that ruff and mypy
# do not. Run it only when the Python surface or this workflow changes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  # Preserve every main baseline scan while cancelling obsolete PR heads.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  python-changes:
    name: Detect Python changes
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        name: Check changed files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$head")"
          else
            changed_files="$(git diff --name-only "$base" "$head")"
          fi

          changed=false
          while IFS= read -r file; do
            case "$file" in
              *.py|pyproject.toml|.github/workflows/codeql.yml)
                changed=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (Python)
    needs: python-changes
    if: needs.python-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          queries: +security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: '/language:python'
          # Perform full database compilation and security query execution,
          # failing on analyzer/query errors while avoiding the GHAS upload API
          # which requires advanced security features on private repositories.
          upload: 'never'
          output: '${{ runner.temp }}/codeql-results'
      # No GHAS upload path on a private repo, so the SARIF is graded here
      # rather than in the Security tab. The gate stays "zero findings" with
      # one escape hatch: a checked-in list of accepted findings, keyed on
      # rule id + path so a refactor that moves the line doesn't churn it.
      # An accepted entry that matches nothing fails too — an exception that
      # outlives the code it excuses is how a gate goes quietly blind.
      - name: Gate on CodeQL findings
        env:
          ACCEPTED: .github/codeql-accepted-findings.json
        run: |
          set -euo pipefail
          mapfile -t reports < <(find "$RUNNER_TEMP/codeql-results" -type f -name '*.sarif')
          [ "${#reports[@]}" -gt 0 ] || { echo "No CodeQL SARIF report was produced" >&2; exit 1; }
          verdict="$(jq -s --slurpfile accepted "$ACCEPTED" '
            [ .[].runs[].results[]?
              | { rule: .ruleId,
                  path: .locations[0].physicalLocation.artifactLocation.uri,
                  line: .locations[0].physicalLocation.region.startLine,
                  message: .message.text } ] as $found
            | [ $accepted[0][] | { rule, path } ] as $ok
            | { unexpected: [ $found[]
                  | select(({ rule, path }) as $k | ($ok | index($k)) == null) ],
                stale: [ $ok[]
                  | select(. as $k
                      | ([ $found[] | { rule, path } ] | index($k)) == null) ] }
          ' "${reports[@]}")"
          if [ "$(jq '.unexpected | length' <<<"$verdict")" -ne 0 ]; then
            echo "::error::CodeQL reported findings that are not accepted in $ACCEPTED" >&2
            jq -r '.unexpected[] | "  \(.rule)  \(.path):\(.line)  \(.message)"' \
              <<<"$verdict" >&2
            exit 1
          fi
          if [ "$(jq '.stale | length' <<<"$verdict")" -ne 0 ]; then
            echo "::error::$ACCEPTED accepts findings CodeQL no longer reports — delete them" >&2
            jq -r '.stale[] | "  \(.rule)  \(.path)"' <<<"$verdict" >&2
            exit 1
          fi
          echo "CodeQL clean ($(jq 'length' "$ACCEPTED") accepted finding(s) matched)."
      - name: Retain CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: '${{ runner.temp }}/codeql-results'
          if-no-files-found: error
          retention-days: 14
